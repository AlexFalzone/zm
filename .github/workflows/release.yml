name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o zm.exe .

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o zm .

      - name: Package artifacts
        run: |
          mv zm.exe zm-windows-amd64.exe
          tar czf zm-linux-amd64.tar.gz zm
          rm zm

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zm-windows-amd64.exe
            zm-linux-amd64.tar.gz
